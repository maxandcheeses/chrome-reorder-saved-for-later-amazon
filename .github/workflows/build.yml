name: Build extension package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Read version from manifest
        id: version
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Package extension for the Chrome Web Store
        run: |
          mkdir -p dist
          zip -r "dist/chrome-reorder-saved-for-later-amazon-${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            popup.html \
            popup.js \
            content.js \
            content.css \
            icons \
            -x '*.DS_Store'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: dist/*.zip

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
